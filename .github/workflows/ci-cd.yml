name: CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: docker.io          # реестр образов (для локального прогона подменяется на localhost:5001)

jobs:
  # ---------- CI, задание 1: тесты всех сервисов ----------
  test:
    name: Тесты ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [booking_service, payment_service, users_service, reviews_service,
                  catalog_service, monitoring_service, deploy_service, notification_service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare tests
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v

      - name: Run component tests
        run: python -m pytest tests/component -v

  # ---------- CI: интеграционные тесты репозиториев на настоящем PostgreSQL ----------
  integration:
    name: Интеграционные ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [booking_service, payment_service, users_service, catalog_service, notification_service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare tests
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: python -m pytest tests/integration -v

  # ---------- CI, задание 1: сборка образов всех сервисов ----------
  build:
    name: Сборка ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, integration]
    strategy:
      fail-fast: false
      matrix:
        service: [booking_service, payment_service, users_service, reviews_service,
                  catalog_service, monitoring_service, deploy_service, notification_service]
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build ./${{ matrix.service }} --tag ${{ matrix.service }}:ci

      - name: Smoke test of the image
        run: docker run --rm ${{ matrix.service }}:ci python -c "import app.main; print('image OK')"

  # ---------- CD, задание 2: доставка в DockerHub (по одному сервису на студента) ----------
  push-to-dockerhub:
    name: DockerHub ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_PUSH == 'true' }}
    strategy:
      matrix:
        service: [booking_service, users_service, catalog_service, notification_service]
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build ./${{ matrix.service }} --tag ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

      - name: Log in to DockerHub
        if: ${{ env.REGISTRY == 'docker.io' }}
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tag to registry
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  # ---------- CD, задание 3: бессерверные контейнеры в Яндекс.Облаке ----------
  build-and-push-to-yc:
    name: YC Registry ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.YC_DEPLOY == 'true' }}
    strategy:
      matrix:
        service: [payment_service, reviews_service, monitoring_service, deploy_service]
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build ./${{ matrix.service }} --tag cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ matrix.service }}:latest

      - name: Login to YC Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_KEYS }}

      - name: Push tag to YC Registry
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy ${{ matrix.container }}
    runs-on: ubuntu-latest
    needs: [build-and-push-to-yc]
    strategy:
      matrix:
        include:
          - {service: payment_service, container: zhulev-payment}
          - {service: reviews_service, container: pospelov-reviews}
          - {service: monitoring_service, container: ogannisyan-monitoring}
          - {service: deploy_service, container: golovach-deploy}
    steps:
      - name: Deploy serverless container
        uses: yc-actions/yc-sls-container-deploy@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_KEYS }}
          container-name: ${{ matrix.container }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-image-url: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ matrix.service }}:latest
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-env: |
            AMQP_URL=${{ secrets.ENV_AMQP_URL }}
            POSTGRES_URL=${{ secrets.ENV_POSTGRES_URL }}
            SERVICE_TOKEN=${{ secrets.ENV_SERVICE_TOKEN }}
            JWT_SECRET=${{ secrets.ENV_JWT_SECRET }}
            BOOKING_URL=${{ secrets.ENV_BOOKING_URL }}
            USERS_URL=${{ secrets.ENV_USERS_URL }}
